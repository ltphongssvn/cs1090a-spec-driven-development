# mise.toml
# TASKS. The toolchain lives in flake.nix; this file does not own tools.
#
# EVERY PROJECT OPERATION IS A TASK. Not a remembered command, not a paste from
# scrollback. A one-off CLI invocation is behaviour that exists only in one
# person's shell history: untested, undiscoverable, impossible to change
# deliberately, and invisible to review.
#
# --- WHY THERE IS NO [tools] BLOCK --------------------------------------------
#
# Declaring the same tools here AND in flake.nix is two declarations of one
# fact, which is the drift this repository exists to remove, reproduced at its
# centre. flake.nix is the single declaration, and policies/repository/ now
# REFUSES a [tools] block rather than trusting this comment.

[task_config]
# EVERY TASK RUNS INSIDE THE NIX DEVSHELL. Without it `uv`, `opa` and the rest
# are unresolvable, because nothing puts them on PATH for a task body.
#
# THE SHELL IS ALSO PINNED. mise defaults to `sh`, which is bash-in-POSIX-mode
# on macOS and dash on the Ubuntu runner: same task body, different interpreter,
# green locally and dead in CI.
#
# BASH DOES NOT SET errexit, WHICH IS WHY EVERY MULTI-COMMAND TASK OPENS WITH
# `set -euo pipefail` -- and why a policy now enforces it rather than trusting
# this note.
shell = "nix develop --command bash -c"

# --- Nix ----------------------------------------------------------------------

[tasks."nix:shell"]
description = "Enter the Nix devShell interactively"
run = "nix develop"

[tasks."nix:flake-check"]
description = "Evaluate the flake on every supported platform"
# --all-systems IS THE POINT. Without it only the current platform is checked,
# and a package present on Darwin but not Linux passes locally and breaks on the
# runner.
run = "nix flake check --no-build --all-systems"

# --- Individual gates ---------------------------------------------------------

[tasks.fmt]
description = "Apply every safe autofix: formatting AND import ordering"
# FIX AND VERIFY ARE DIFFERENT COMMANDS. `fmt` applies what can be applied;
# `lint` reports what remains. Conflating them makes the fixer fail for findings
# it was never able to fix, which trains people to ignore its exit code.
#
# THE EXIT CODES ARE RUFF'S, AND THEY ARE DOCUMENTED:
#   0  no violations, OR every violation was fixed automatically
#   1  violations remain that no safe autofix could resolve
#   2  ruff terminated abnormally -- invalid config, or an internal error
#
# SO 1 IS EXPECTED HERE AND 2 IS NOT. The policy gate denied the previous
# version of this task for running two commands without errexit, and it was
# right: with a bare `;` and no `set -e`, the task's exit code was the
# formatter's alone and a broken ruff reported success.
#
# `|| true` WOULD HAVE BEEN THE EASY FIX AND IS TOO BROAD -- it swallows exit 2
# along with exit 1, which is the one case that means the toolchain itself is
# wrong. Accepting exactly 1 states the intent and keeps a real failure fatal.
run = '''
set -euo pipefail
uv run ruff check --fix . || [ $? -eq 1 ]
uv run ruff format .
'''

[tasks.lint]
description = "Verify: report every finding, fix nothing"
run = "uv run ruff check ."

[tasks.types]
description = "Static type check, for every platform this code runs on"
# BOTH PLATFORMS, DELIBERATELY. mypy defaults to whichever OS it runs on and
# NARROWS sys.platform comparisons, so a Darwin-only branch is invisible to a
# Linux run and vice versa.
run = '''
set -euo pipefail
uv run mypy --platform darwin src tests
uv run mypy --platform linux src tests
'''

[tasks.test]
description = "Hermetic tests: no network, no credentials"
run = "uv run pytest"

[tasks."test:integration"]
description = "Tests requiring network and credentials"
# WITHOUT THIS THE INTEGRATION TESTS RUN NOWHERE. They are deselected from the
# default run by design, so writing one and stopping there produces a test that
# exists and never executes.
run = "uv run pytest -m integration"

# --- Policy as code -----------------------------------------------------------
#
# THE SPLIT IS A DIFFERENCE IN KIND, not a convenience:
#
#   check:policy            are the policies well-formed, idiomatic and tested?
#   check:policy-decisions  does THIS REPOSITORY satisfy them?
#
# A policy suite can be immaculate and enforce nothing, which is why the second
# task exists and why it reads real configuration rather than a fixture. It has
# already earned its place twice: it found a false positive in its own parsing
# rule, and then a real defect in the fmt task above.

[tasks."check:policy"]
description = "Format, check, lint and unit-test every Rego policy"
# --fail-on-empty IS NOT OPTIONAL: `opa test` SUCCEEDS when zero tests run, so a
# renamed package or mistyped path reports green while testing nothing. The
# policies themselves refuse a task that omits the flag.
#
# --strict TURNS WARNINGS INTO ERRORS, so an unused import or shadowed variable
# fails here rather than being read past.
run = '''
set -euo pipefail
opa fmt --fail --diff policies/
opa check --strict policies/
regal lint policies/
opa test policies/ --fail-on-empty
'''

[tasks."check:policy-decisions"]
description = "Evaluate this repository against its own policies, and record the verdict"
run = "uv run python -m cs1090a_spec_driven_development policy"

# --- Security -----------------------------------------------------------------

[tasks."check:workflow"]
description = "Audit the GitHub Actions workflow that runs this gate"
# THE PIPELINE AUDITS ITSELF. zizmor found actions/checkout persisting the job
# token in .git/config -- a credential left on disk for a run whose last step
# uploads an artifact directory.
run = "zizmor .github/workflows/ci.yml"

[tasks."check:secrets"]
description = "Scan the FULL HISTORY for committed credentials"
# --redact IS NOT COSMETIC: without it a finding prints the credential into a CI
# log that is retained and often world-readable.
run = "betterleaks git --redact --no-banner"

[tasks."check:deps"]
description = "Scan uv.lock for known vulnerabilities"
run = "osv-scanner scan source --lockfile uv.lock"

# --- Authoring ----------------------------------------------------------------

[tasks.author]
description = "Write a file from stdin, atomically, then judge what landed"
# THE SHELL STOPS BEING THE WRITER.
#
#   mise run author path/to/file << 'EOF'
#   ...exact source bytes...
#   EOF
#
# A REDIRECT CREATES THE FILE AND NEVER THE DIRECTORY, truncates the target
# before the payload arrives, and applies whatever newline translation the
# terminal decides on. This reads raw bytes from stdin, creates parents, writes
# to a sibling temporary file and renames it over the target -- then reads it
# BACK and emits a Verdict, so a corrupted transport fails the command rather
# than passing because `cat` returned zero.
usage = '''
arg "<path>" help="Path relative to the repository root"
'''
run = 'uv run python -m cs1090a_spec_driven_development author "${usage_path?}"'

# --- Mutation testing ---------------------------------------------------------

[tasks.mutants]
description = "Mutate the package and run the suite against every mutant, from scratch"
# THE SCRATCH TREE IS DELETED FIRST, AND THAT IS A BUG FIX RATHER THAN CAUTION.
#
# mutmut CACHES per-mutant results and cannot track behavioural changes in
# NON-PYTHON files. Editing pyproject.toml or mise.toml leaves every cached
# verdict in place and prints a warning nobody reads, so the run reports at
# 0.00 mutations/second and re-tests NOTHING.
#
# THIS REPOSITORY ALREADY GOT A WRONG ANSWER FROM IT: a cached run reported 35
# survivors while a scratch run of the same code reported 7.
run = '''
set -euo pipefail
rm -rf mutants
uv run mutmut run --max-children 4
uv run mutmut export-cicd-stats
'''

[tasks."mutants:check"]
description = "Fail unless the last mutation run killed every mutant"
# EXIT 2 MEANS THE RUN MEASURED NOTHING, which is neither pass nor fail.
run = "uv run python -m cs1090a_spec_driven_development mutants"

[tasks."mutants:survivors"]
description = "Show the diff of every surviving mutant, for review one at a time"
# THE DIFFS ARE THE POINT, not the count. A survivor is either an assertion
# worth writing, a line worth deleting, or an equivalent mutant worth
# refactoring away -- and only the diff distinguishes them.
run = '''
set -euo pipefail
uv run mutmut results \
  | grep survived \
  | awk '{print $1}' \
  | tr -d ':' \
  | while read -r mutant; do uv run mutmut show "$mutant"; done
'''

# --- Onboarding ---------------------------------------------------------------

[tasks.setup]
description = "One-command onboarding: dependencies and git hooks"
# `lefthook install` writes into .git/hooks, which is NOT version controlled. A
# fresh clone has no hooks at all, so the person who most needs the guardrails
# is the one running without them.
#
# NEVER ADD -f TO lefthook install. Without it, lefthook declines when
# core.hooksPath points elsewhere. With it, lefthook force-installs into
# whatever that path resolves to -- and when that is a GLOBAL hooks directory,
# this repo's hooks start running in every repository on the machine.
run = '''
set -euo pipefail

hooks_path="$(git config --get core.hooksPath || true)"
if [ -n "$hooks_path" ]; then
  echo "refusing: core.hooksPath is set to '$hooks_path'." >&2
  echo "lefthook would decline rather than clobber it, which is correct --" >&2
  echo "but you would be left with no hooks and no explanation." >&2
  echo "" >&2
  echo "inspect first:" >&2
  echo "  git config --show-origin --get-all core.hooksPath" >&2
  echo "then clear it deliberately:" >&2
  echo "  git config --unset core.hooksPath" >&2
  exit 1
fi

uv sync --locked --all-groups
lefthook install

echo
echo "setup complete. hooks active:"
# RESOLVE THE HOOKS PATH; NEVER ASSUME .git/hooks. In a linked worktree .git is
# a FILE pointing at .git/worktrees/<name>, so `ls .git/hooks` fails with "Not a
# directory" -- and that cosmetic listing takes the exit code with it after
# every real step has succeeded.
hooks_dir="$(git rev-parse --git-path hooks)"
if [ -d "$hooks_dir" ]; then
  ls "$hooks_dir" | grep -v sample | sed 's|^|  |'
else
  echo "  (none found at $hooks_dir)"
fi
'''

# --- Repository configuration -------------------------------------------------

[tasks."repo:configure"]
description = "Apply repository settings and branch ruleset (idempotent)"
# GOVERNANCE AS CODE. Repository settings clicked in a web UI are invisible to
# the repo, unreviewable and unreproducible.
#
# MERGE COMMITS ONLY: GitFlow depends on merge topology, and squashing would
# collapse commits whose reasoning is the most valuable thing in this history.
#
# THE READBACK IS THE POINT. Applying a ruleset proves a request was accepted;
# reading it back proves what the SERVER now holds.
run = '''
set -euo pipefail

gh api -X PATCH "repos/{owner}/{repo}" \
  -F allow_auto_merge=true \
  -F allow_merge_commit=true \
  -F allow_squash_merge=false \
  -F allow_rebase_merge=false \
  -F delete_branch_on_merge=true \
  > /dev/null
echo "settings applied"

name="develop-and-main-protection"
existing="$(gh api "repos/{owner}/{repo}/rulesets" --jq \
  ".[] | select(.name == \"$name\") | .id" || true)"

if [ -n "$existing" ]; then
  gh api -X PUT "repos/{owner}/{repo}/rulesets/$existing" \
    --input contracts/ruleset-develop-and-main.json > /dev/null
  echo "ruleset updated (id $existing)"
else
  gh api -X POST "repos/{owner}/{repo}/rulesets" \
    --input contracts/ruleset-develop-and-main.json > /dev/null
  echo "ruleset created"
fi

echo "--- readback ---"
gh api "repos/{owner}/{repo}" \
  --jq '{auto_merge:.allow_auto_merge, merge_commit:.allow_merge_commit, squash:.allow_squash_merge, rebase:.allow_rebase_merge, delete_on_merge:.delete_branch_on_merge}'
gh api "repos/{owner}/{repo}/rulesets" \
  --jq '.[] | {id, name, enforcement}'
'''

# --- Workflow -----------------------------------------------------------------

[tasks.pr]
description = "Open a pull request against develop"
# --fill USES THE COMMIT MESSAGES, which in this repository carry the reasoning
# a reviewer needs. Retyping them into a PR body would create a second account
# that drifts from the first.
run = "gh pr create --base develop --fill"

[tasks."pr-status"]
description = "Show merge state and checks for the current branch's PR"
run = "gh pr view --json number,title,mergeable,mergeStateStatus,statusCheckRollup --jq '{pr:.number,title,mergeable,state:.mergeStateStatus,checks:[.statusCheckRollup[]|{name,conclusion}]}'"

[tasks."start:check"]
description = "Refuse to work on a protected branch"
# Wired into the pre-commit hook so the guard fires before a commit lands rather
# than after.
run = '''
set -euo pipefail
branch="$(git rev-parse --abbrev-ref HEAD)"
case "$branch" in
  develop|main)
    echo "refusing: on protected branch '$branch'." >&2
    echo "" >&2
    echo "GitFlow: work happens on a feature branch cut from origin/develop." >&2
    echo "" >&2
    echo "nothing is lost -- carry the work across with:" >&2
    echo "  git switch -c feature/<slug>" >&2
    exit 1 ;;
esac
echo "on $branch (not protected)"
'''

[tasks."start:here"]
description = "Cut a feature branch from origin/develop in THIS shell"
# PRINTS the command instead of pretending to run it, because a mise task runs
# in a subshell and cannot change the invoking shell's branch:
#
#   eval "$(mise run start:here <slug>)"
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. git-topology"
'''
run = '''
set -euo pipefail
slug="$usage_slug"

case "$slug" in
  *[!a-z0-9-]*|"")
    echo "echo 'slug must be lowercase kebab-case: $slug' >&2; false" ;;
  *)
    echo "git fetch origin --prune --quiet && git switch -c feature/$slug origin/develop" ;;
esac
'''

# --- Worktrees ----------------------------------------------------------------
# SHELL FOR NOW, AND THIS IS THE DEBT THIS BRANCH EXISTS TO REPAY. These tasks
# should delegate to a TESTED module that inspects git topology through
# porcelain output rather than string comparison.
#
# THE MEASUREMENT THAT PROVES THE POINT: a real bash parser reads 19 of this
# file's 25 task bodies. The six it cannot read are repo:configure, setup,
# start:check, start:here, worktree:add and worktree:remove -- every task with
# real shell logic. A body no parser can read is a body nobody can analyse.
#
# THE ? IN ${usage_slug?} IS THE POINT: bash parameter expansion that FAILS when
# the variable is unset rather than expanding to empty. Without it a missing
# argument becomes `worktree remove ""`, a command that runs and does something
# nobody asked for.

[tasks."worktree:add"]
description = "Create a sibling worktree on a new feature branch, cut from origin/develop"
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. git-topology"
'''
run = '''
set -euo pipefail
slug="${usage_slug?}"

case "$slug" in
  *[!a-z0-9-]*|"")
    echo "refusing: slug must be lowercase kebab-case: '$slug'" >&2
    exit 1 ;;
esac

# ASK GIT FOR THE LAYOUT; NEVER DERIVE IT FROM $PWD. Run from inside a linked
# worktree, $PWD is the worktree and not the repository, so every sibling path
# computed from it lands one level too deep.
common="$(git rev-parse --git-common-dir)"
root="$(cd "$(dirname "$common")" && pwd)"
parent="$(dirname "$root")"
siblings="$parent/$(basename "$root")-worktrees"
target="$siblings/$slug"

if [ -e "$target" ]; then
  echo "refusing: '$target' already exists" >&2
  exit 1
fi

# FETCH FIRST. Branching from a local `develop` cuts from whatever this machine
# last pulled, which is how a feature branch quietly starts life behind the
# integration branch.
git fetch origin --prune --quiet

mkdir -p "$siblings"
git worktree add -b "feature/$slug" "$target" origin/develop

echo
echo "worktree ready:"
git worktree list
'''

[tasks."worktree:list"]
description = "List worktrees, their branches, and any locked or prunable flags"
run = "git worktree list --porcelain"

[tasks."worktree:remove"]
description = "Remove a worktree and delete its branch, refusing to force either"
usage = '''
arg "<slug>" help="The slug used with worktree:add"
'''
run = '''
set -euo pipefail
slug="${usage_slug?}"

common="$(git rev-parse --git-common-dir)"
root="$(cd "$(dirname "$common")" && pwd)"
target="$(dirname "$root")/$(basename "$root")-worktrees/$slug"

# NO --force, EITHER TIME. `worktree remove` refuses when the tree is dirty and
# `branch -d` refuses when the branch is unmerged; both refusals are the feature.
git worktree remove "$target"
git branch -d "feature/$slug"

echo "removed $target and feature/$slug"
'''
