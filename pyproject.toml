# pyproject.toml
[project]
name = "cs1090a-spec-driven-development"
version = "0.1.0"
description = "Statutory leave and absence compliance, built spec-first: the statute is the specification, the determination is evidence"
# MUST MATCH .python-version. One fact declared twice drifts; the env-parity
# gate enforces the link so a mismatch fails a check rather than surfacing as a
# confusing runtime error weeks later.
requires-python = "==3.12.3"

# CONTRACT-FIRST, AND THESE ARE RUNTIME DEPENDENCIES RATHER THAN DEV TOOLS,
# because the contracts execute inside the service, not only in the test suite.
dependencies = [
  "pydantic>=2.10",
  "fastapi>=0.115",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
  # OUTSIDE-IN TDD NEEDS AN HTTP CLIENT THAT SPEAKS TO THE APP IN-PROCESS.
  # httpx's ASGI transport issues a request WITHOUT binding a socket, so the
  # acceptance tests are hermetic and can sit behind a git hook.
  "httpx>=0.28",
  # THE ASYNC TEST RUNNER. Without a plugin an `async def` test is COLLECTED,
  # SKIPPED WITH A WARNING, AND REPORTED AS PASSING -- a test that never ran and
  # never said so.
  "anyio>=4.6",
  # PROPERTY-BASED TESTING, added because an example test failed for the wrong
  # reason: a fixture defect the suite could not distinguish from a code defect.
  "hypothesis>=6.120",
  # MUTATION TESTING, FROM DAY ONE AND NOT AS A RATCHET. A green suite proves
  # the code RUNS; it does not prove the assertions would NOTICE if the code
  # were wrong. A surviving mutant in an eligibility rule is a statute this
  # service can get wrong with no test objecting.
  "mutmut>=3.2",
  # THE POLICY GATE READS THE WORKFLOW AS DATA. Asserting that ci.yml declares
  # the context the branch ruleset requires needs the file parsed, not grepped.
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  # A REAL BASH PARSER, AND THE REASON IS MEASURED RATHER THAN PREFERRED.
  #
  # The policy gate must know what a task body actually does. Three cheaper
  # approaches were tried and rejected against the real mise.toml:
  #
  #   substring matching      denied `setup` for a `git` on one line and a
  #                           `| grep` thirty lines away
  #   per-line correlation    still substring matching; quoted text and
  #                           `;`-separated commands defeat it next
  #   shlex tokenising        16 lines raised, and nested substitution was torn
  #                           apart: root="$(cd "$(dirname "$common")" && pwd)"
  #                           became ['root=$(cd $', '(', 'dirname', ...]
  #
  # bashlex is a transliteration of GNU bash's own parser and yields a real AST.
  # It reads 19 of this repository's 25 task bodies; the 6 it cannot read are
  # exactly the tasks carrying shell logic, which is the finding that set the
  # rest of this branch's direction.
  "bashlex>=0.18",
  # AMBIENT PROCESS STATE, MADE A VALIDATED SNAPSHOT. SecretStr renders as
  # ********** when printed, which is stronger than remembering not to print a
  # credential.
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# SRC LAYOUT, DECLARED. Tests import the INSTALLED package, so a test exercises
# what ships rather than what happens to be on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src/cs1090a_spec_driven_development"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# MUTMUT'S SCRATCH COPY IS NOT SOURCE. It is a generated tree of deliberately
# broken variants; linting it reports findings describing mutants rather than
# code, and formatting it would rewrite the very mutations under test.
extend-exclude = ["mutants"]

[tool.ruff.lint]
# Deliberately broader than defaults. S is bandit: executed CODE gets checked,
# not only the data it processes.
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
# THE PACKAGE IS NAMED EXPLICITLY, AND CI IS WHY. Locating first-party code by
# PATH works where the package is installed editable beside its source; on the
# runner ruff split one import block in two, failing I001 there and passing
# here. A lint that disagrees with itself across machines is worse than none.
known-first-party = ["cs1090a_spec_driven_development"]

[tool.ruff.lint.per-file-ignores]
# S101 forbids `assert` because Python strips asserts under -O, so an assert
# used as a runtime check silently disappears. That does not apply in a test
# file: asserts ARE the mechanism and pytest never runs optimized. S603/S607 are
# subprocess warnings, and proving a command behaves cannot be faked in-process.
"tests/*.py" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
# SAME REASON AS ruff's extend-exclude: type-checking deliberately broken code
# reports the mutations, not defects.
exclude = ["mutants/.*"]

# THE PYDANTIC PLUGIN, WHICH strict = true DOES NOT REPLACE.
#
# Every contract in this repository is a pydantic model, and without the plugin
# mypy types `Model(...)` as accepting **Any: a wrong field name, a missing
# required field or a wrong type at a CONSTRUCTION SITE goes unreported and
# surfaces as a ValidationError at runtime instead.
#
# THE PLUGIN ALSO SEES WHAT PYDANTIC DOES AT RUNTIME. Nested models auto-parse
# from dicts, so `PolicyInput(tasks={"lint": {"run": "..."}})` WORKS while being
# a different shape from what the field declares -- convenient, and precisely
# the silent drift that let three test fixtures keep subscripting a TaskBody
# like a dictionary after the contract changed underneath them.
plugins = ["pydantic.mypy"]

# --- Fail closed --------------------------------------------------------------
# strict = true is not the ceiling. These turn silence into failure.
warn_unused_configs = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]

[tool.pydantic-mypy]
# THE PLUGIN'S OWN FAIL-CLOSED SETTINGS, each turning a runtime surprise into a
# type error:
#
#   init_forbid_extra    a keyword no field accepts is a typo, and pydantic
#                        would raise only when the line is reached
#   init_typed           a wrongly-typed argument is caught at the call site
#                        rather than by validation
#   warn_required_...    a dynamic alias hides whether a field is required, so
#                        the plugin cannot check the constructor at all
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# bashlex SHIPS NO STUBS AND NO py.typed MARKER, so strict mode reports an error
# per import for a library whose types are not this project's concern. A blanket
# ignore_errors would hide real problems in our own code; this is scoped to the
# one module, and shell.py annotates the boundary so nothing downstream sees Any.
#
# NOTE THE CONTRAST WITH pyyaml: types-PyYAML EXISTS and is a dev dependency, so
# yaml needs no override. An override where a stub package exists would be
# choosing to go untyped.
[[tool.mypy.overrides]]
module = ["bashlex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# MARKERS ARE REGISTERED, AND UNREGISTERED ONES ARE AN ERROR.
markers = [
  "acceptance: the outermost test of a slice; drives the design from the outside in",
  "integration: requires network and credentials; excluded from the default run",
]

# --- Fail closed --------------------------------------------------------------
# --strict-markers   a typo'd marker is an ERROR, not a silently-created one.
# --strict-config    an unknown ini key is an error rather than ignored.
# -ra                report the reason for every non-passing outcome.
# -m not integration the default run is HERMETIC, so it can sit behind a hook.
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not integration"]

# An xfail that PASSES is a failure. Otherwise a fixed bug leaves its xfail in
# place forever and the suite reports success for a test asserting nothing.
xfail_strict = true

[tool.mutmut]
# WHAT GETS MUTATED: the shipped package only. NOT tests/ -- mutating a test
# produces mutants trivially "killed" by the mutated test failing itself.
#
# `source_paths`, NOT `paths_to_mutate`. The older key emits a
# DeprecationWarning that scrolls past in CI until the key is removed and
# mutation silently covers nothing.
source_paths = ["src/cs1090a_spec_driven_development"]

# THE RUNNER CARRIES A PYTHONPATH because mutmut copies the tree to ./mutants
# and runs there, while uv's editable install is a .pth holding an ABSOLUTE path
# to the real ./src -- so imports resolved to the UNMUTATED original. Verified
# by printing __file__ under each configuration rather than inferred.
runner = "PYTHONPATH=src ../.venv/bin/pytest -x -q --no-header"
